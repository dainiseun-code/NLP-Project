<svg xmlns="http://www.w3.org/2000/svg" width="960" height="408" viewBox="0 0 960 408" role="img" aria-labelledby="title desc"><title id="title">Messaging assistant architecture</title><desc id="desc">Request and records pass through retrieval, Qwen and validation; optional extraction informs retrieval and annotations, and optional binding acts after generation.</desc><rect x="0" y="0" width="960" height="408" rx="0" fill="#ffffff"/><text x="36" y="42" font-family="Arial, sans-serif" font-size="26" fill="#17263d" text-anchor="start" font-weight="bold">From request to grounded decision</text><text x="36" y="70" font-family="Arial, sans-serif" font-size="16" fill="#526579" text-anchor="start" font-weight="normal">The original request is retained in all three conditions</text><rect x="36" y="112" width="184" height="80" rx="8" fill="#edf3f8"/><text x="128.0" y="144" font-family="Arial, sans-serif" font-size="18" fill="#17263d" text-anchor="middle" font-weight="bold">Request +</text><text x="128.0" y="170" font-family="Arial, sans-serif" font-size="18" fill="#17263d" text-anchor="middle" font-weight="normal">eligible records</text><rect x="268" y="112" width="184" height="80" rx="8" fill="#edf3f8"/><text x="360.0" y="144" font-family="Arial, sans-serif" font-size="18" fill="#17263d" text-anchor="middle" font-weight="bold">Evidence</text><text x="360.0" y="170" font-family="Arial, sans-serif" font-size="18" fill="#17263d" text-anchor="middle" font-weight="normal">retrieval</text><rect x="500" y="112" width="184" height="80" rx="8" fill="#edf3f8"/><text x="592.0" y="144" font-family="Arial, sans-serif" font-size="18" fill="#17263d" text-anchor="middle" font-weight="bold">Local Qwen</text><text x="592.0" y="170" font-family="Arial, sans-serif" font-size="18" fill="#17263d" text-anchor="middle" font-weight="normal">decision</text><rect x="732" y="112" width="184" height="80" rx="8" fill="#edf3f8"/><text x="824.0" y="144" font-family="Arial, sans-serif" font-size="18" fill="#17263d" text-anchor="middle" font-weight="bold">Validation +</text><text x="824.0" y="170" font-family="Arial, sans-serif" font-size="18" fill="#17263d" text-anchor="middle" font-weight="normal">saved result</text><text x="244" y="161" font-family="Arial, sans-serif" font-size="28" fill="#215b91" text-anchor="middle" font-weight="normal">→</text><text x="476" y="161" font-family="Arial, sans-serif" font-size="28" fill="#215b91" text-anchor="middle" font-weight="normal">→</text><text x="708" y="161" font-family="Arial, sans-serif" font-size="28" fill="#215b91" text-anchor="middle" font-weight="normal">→</text><rect x="268" y="260" width="184" height="68" rx="8" fill="#e2f3ee"/><text x="360" y="288" font-family="Arial, sans-serif" font-size="18" fill="#008477" text-anchor="middle" font-weight="bold">XLM-R extractor</text><text x="360" y="312" font-family="Arial, sans-serif" font-size="16" fill="#008477" text-anchor="middle" font-weight="normal">optional</text><line x1="360" y1="256" x2="360" y2="204" stroke="#008477"/><line x1="360" y1="204" x2="355" y2="212" stroke="#008477"/><line x1="360" y1="204" x2="365" y2="212" stroke="#008477"/><text x="376" y="236" font-family="Arial, sans-serif" font-size="15" fill="#008477" text-anchor="start" font-weight="normal">Informs retrieval</text><line x1="456" y1="294" x2="592" y2="294" stroke="#008477"/><line x1="592" y1="294" x2="592" y2="204" stroke="#008477"/><line x1="592" y1="204" x2="587" y2="212" stroke="#008477"/><line x1="592" y1="204" x2="597" y2="212" stroke="#008477"/><text x="484" y="318" font-family="Arial, sans-serif" font-size="15" fill="#008477" text-anchor="start" font-weight="normal">Annotations may</text><text x="484" y="340" font-family="Arial, sans-serif" font-size="15" fill="#008477" text-anchor="start" font-weight="normal">also go to Qwen</text><text x="732" y="246" font-family="Arial, sans-serif" font-size="16" fill="#745293" text-anchor="start" font-weight="bold">Optional recipient</text><text x="732" y="268" font-family="Arial, sans-serif" font-size="16" fill="#745293" text-anchor="start" font-weight="bold">binding</text><text x="732" y="294" font-family="Arial, sans-serif" font-size="16" fill="#526579" text-anchor="start" font-weight="normal">After generation;</text><text x="732" y="318" font-family="Arial, sans-serif" font-size="16" fill="#526579" text-anchor="start" font-weight="normal">does not write the draft.</text><text x="36" y="384" font-family="Arial, sans-serif" font-size="16" fill="#526579" text-anchor="start" font-weight="normal">Output: draft  ·  clarification  ·  unsupported    |    No messages are sent</text></svg>
