[project]
name = "messaging-nlp-encoder"
version = "0.1.0"
description = "Isolated local CPU encoder runtime"
requires-python = ">=3.11,<3.12"
dependencies = [
    "messaging-nlp",
    "torch==2.8.0",
    "transformers==4.57.6",
    "tokenizers==0.22.2",
    "safetensors==0.7.0",
    "sentencepiece==0.2.1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
messaging-nlp = { path = "../..", editable = true }
