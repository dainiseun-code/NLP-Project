[project]
name = "messaging-nlp-qwen"
version = "0.1.0"
description = "Isolated local Qwen MLX runtime"
requires-python = ">=3.11,<3.12"
dependencies = [
    "messaging-nlp",
    "mlx==0.32.4",
    "mlx-lm==0.32.2",
    "transformers==5.20.2",
    "outlines==1.3.3",
    "pydantic==2.14.1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
messaging-nlp = { path = "../..", editable = true }
